aid: packet-host
name: Packet Host
description: >-
  Packet Host, Inc. (packet.com / api.packet.net) was a New York-based bare-metal
  cloud provider, backed by Battery Ventures, that let developers provision
  dedicated single-tenant servers on demand through a REST API, CLI, and
  Terraform. Equinix acquired Packet in 2020 and rebranded the service Equinix
  Metal, moving the API to api.equinix.com/metal/v1. Equinix Metal was fully
  retired: End-of-Sale was announced 2024-11-07 and the service was sunset
  2026-06-30. This profile captures the Metal API surface (220 operations across
  40 tags) and the Packet-to-Equinix-Metal lineage.
