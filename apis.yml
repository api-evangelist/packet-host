apis:
- aid: packet-host:packet-host-authentication-api
  name: Packet Host Authentication API
  description: >-
    Nearly all of the endpoints in the API require authentication. Authentication is performed by providing
    an authentication token (interchangeably referred to as an API key) in the `X-Auth-Token` HTTP request
    header.


    <!-- ReDoc-Inject: <security-definitions> -->


    User API keys can be obtained by creating them in the Equinix Metal Portal or by using the [Create
    a User API Key](#operation/createAPIKey) endpoint.


    Project API keys can also be obtained by creating them in the Equinix Metal Portal or by using the
    [Create a Project API Key](#operation/createProjectAPIKey) endpoint. Project API keys are scoped to
    a single project and can only be used to access resources within that project.


    For example, to use an authenticated API token, you would make a request like the following:


    ```bash

    curl -H 'X-Auth-Token: my_authentication_token' \
      https://api.equinix.com/metal/v1/user/api-keys
    ```


    Applications can take advantage of the Equinix Metal API and API keys to perform any of the actions
    that can be performed in the Equinix Metal Portal. For example, you can use the API to create and
    manage devices, projects, and other resources.


    API keys can be deleted without affecting any of the resources created with them. Access to applications
    using the API can be revoked by deleting the API key used to authenticate the application.
  humanURL: https://docs.equinix.com/metal/
  baseURL: https://api.equinix.com/metal/v1
  tags:
  - Authentication
  properties:
  - type: OpenAPI
    url: openapi/packet-host-authentication-api-openapi.yml
  - type: APIReference
    url: https://docs.equinix.com/api-catalog/metalv1/
